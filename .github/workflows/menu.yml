name: Stiahnuť denné menu

on:
  schedule:
    # 07:15 UTC = 09:15 v Bratislave (letný čas) / 08:15 (zimný čas)
    - cron: "15 7 * * 1-5"
  workflow_dispatch:        # umožní spustiť ručne z webu GitHubu

permissions:
  contents: write

concurrency:
  group: menu
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Stiahnuť a spracovať menu
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scraper/scrape.mjs

      - name: Uložiť výsledok do repa
        run: |
          git config user.name "menu-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/menu.json
          git diff --staged --quiet || git commit -m "menu $(date +%F)"
          git push
