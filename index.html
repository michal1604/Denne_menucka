<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Denné menu</title>
<meta name="theme-color" content="#15211A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F0F1EB; --card:#FBFBF7; --ink:#15211A; --ink2:#5A655E;
  --mint:#2E6B52; --stamp:#B33A2B; --rule:#CBCEC2; --hairline:#E4E6DC;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Archivo",system-ui,sans-serif; font-size:16px; line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 0}

/* ---------- hlavička ---------- */
.masthead{position:relative;padding:4px 0 18px;border-bottom:2px solid var(--ink)}
.eyebrow{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink2);margin:0 0 6px}
.masthead h1{font-family:"Anton",sans-serif;font-weight:400;
  font-size:clamp(40px,14vw,60px);line-height:.84;letter-spacing:.005em;
  text-transform:uppercase;margin:0;max-width:5.5em}
.datum{font-family:"Space Mono",monospace;font-size:13px;color:var(--ink2);margin:12px 0 0}
.stamp{position:absolute;top:0;right:-2px;transform:rotate(7deg);
  border:2px solid var(--stamp);border-radius:3px;color:var(--stamp);
  padding:6px 9px 5px;text-align:center;box-shadow:inset 0 0 0 1px var(--stamp)}
.stamp b{display:block;font-family:"Anton",sans-serif;font-size:26px;line-height:.9;font-weight:400}
.stamp span{display:block;font-family:"Space Mono",monospace;font-size:9px;
  letter-spacing:.12em;text-transform:uppercase}

/* ---------- karty ---------- */
.zoznam{display:flex;flex-direction:column;gap:20px;padding:24px 0 0}
.karta{background:var(--card);border:1.5px solid var(--rule);border-radius:4px;
  box-shadow:0 1px 0 rgba(21,33,26,.05), 0 10px 26px -20px rgba(21,33,26,.6)}
.karta.nedostupna{opacity:.62}

.hlava{padding:15px 16px 13px;display:flex;gap:11px;align-items:flex-start}
.cislo{font-family:"Space Mono",monospace;font-weight:700;font-size:12px;
  color:var(--stamp);padding-top:5px;flex:0 0 auto}
.meno{flex:1;min-width:0}
.meno h2{font-family:"Anton",sans-serif;font-weight:400;text-transform:uppercase;
  font-size:22px;line-height:1.04;margin:0;letter-spacing:.01em}
.meta{font-family:"Space Mono",monospace;font-size:11px;color:var(--ink2);
  margin:6px 0 0;display:flex;gap:8px;flex-wrap:wrap}
.meta span:not(:last-child)::after{content:" ·";color:var(--rule)}

/* perforácia — odkaz na gastrolístok */
.perf{border-top:1.5px dashed var(--rule);margin:0 16px}

.jedla{list-style:none;margin:0;padding:4px 16px 6px}
.jedlo{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--hairline)}
.jedlo:last-child{border-bottom:0}
.j-c{font-family:"Space Mono",monospace;font-size:13px;color:var(--ink2);
  flex:0 0 17px;padding-top:2px}
.j-c.p{color:var(--mint);font-weight:700}
.j-telo{flex:1;min-width:0}
.j-nazov{font-size:16px;line-height:1.32}
.j-spodok{font-family:"Space Mono",monospace;font-size:10px;color:var(--ink2);
  margin-top:3px;letter-spacing:.03em}
.veg{color:var(--mint);border:1px solid var(--mint);border-radius:2px;
  padding:0 3px;margin-right:6px;text-transform:uppercase;letter-spacing:.08em}
.j-cena{font-family:"Space Mono",monospace;font-size:16px;font-weight:700;
  flex:0 0 auto;padding-top:1px;letter-spacing:-.03em;white-space:nowrap}

.pata{padding:11px 16px;border-top:1.5px solid var(--rule);
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  font-family:"Space Mono",monospace;font-size:11px;color:var(--ink2)}
.pata a{color:var(--mint);text-decoration:none;border-bottom:1px solid currentColor}

.hlaska{padding:20px 16px 24px;color:var(--ink2);font-size:14px;text-align:center}
.hlaska b{display:block;font-family:"Anton",sans-serif;font-weight:400;font-size:19px;
  text-transform:uppercase;color:var(--ink);margin-bottom:5px;letter-spacing:.01em}

footer{max-width:560px;margin:0 auto;padding:28px 16px 34px;
  font-family:"Space Mono",monospace;font-size:11px;line-height:1.6;color:var(--ink2);
  border-top:1px solid var(--rule);margin-top:26px}
</style>
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">Obed v okolí</p>
    <h1>Denné<br>menu</h1>
    <p class="datum" id="datum">načítavam…</p>
    <div class="stamp" id="stamp"><b>—</b><span>—</span></div>
  </header>

  <main class="zoznam" id="zoznam">
    <p class="hlaska"><b>Načítavam</b>Sťahujem dnešné menu.</p>
  </main>
</div>

<footer id="footer"></footer>

<script>
const VLOZENE = {
  "datum": "2026-08-26",
  "den": "streda",
  "aktualizovane": "2026-08-26T09:17:00+02:00",
  "restauracie": [
    {
      "id": "srdcovka",
      "nazov": "Srdcovka Urban Pub",
      "adresa": "Račianska 26/E",
      "cas": "11:00 – 14:00",
      "url": "https://urbanpub.sk/",
      "stav": "ok",
      "polievky": [{ "nazov": "Slepačí vývar s rezancami", "cena": 1.6, "alergeny": [1, 3, 9] }],
      "jedla": [
        { "c": "1", "nazov": "Vyprážaný bravčový rezeň, zemiaková kaša, uhorka", "cena": 8.4, "alergeny": [1, 3, 7], "veg": false },
        { "c": "2", "nazov": "Kuracie prsia na hríboch, dusená ryža", "cena": 7.9, "alergeny": [7], "veg": false }
      ]
    },
    {
      "id": "spilka",
      "nazov": "Spilka beer & restaurant",
      "adresa": "Legionárska 8",
      "cas": "11:00 – 14:00",
      "url": "https://www.spilkarestaurant.sk/",
      "stav": "ok",
      "polievky": [
        { "nazov": "Šošovicová polievka s klobáskou", "cena": 1.99, "alergeny": [9] },
        { "nazov": "Hovädzí vývar s rezancami, zeleninou, mäsom", "cena": 1.99, "alergeny": [1, 3, 9] }
      ],
      "jedla": [
        { "c": "TIP", "nazov": "Risotto s cuketou a paradajkami, s kúskami kuracieho mäska a parmezánom", "cena": 8.9, "alergeny": [7, 9], "veg": false },
        { "c": "1", "nazov": "Vyprážaný morčací rezeň v syrovom cestíčku so zemiakovou kašou", "cena": 7.9, "alergeny": [1, 3, 7], "veg": false },
        { "c": "2", "nazov": "Vyprážané šampiňóny s maslovými zemiakmi a domácou tatárskou omáčkou", "cena": 7.9, "alergeny": [1, 3, 7, 10], "veg": true },
        { "c": "3", "nazov": "Vyprážaný syr s hranolkami a domácou tatárskou omáčkou", "cena": 7.9, "alergeny": [1, 3, 7, 10], "veg": true }
      ]
    },
    {
      "id": "soupa",
      "nazov": "Soupa Bistro",
      "adresa": "Račianska 22/A",
      "cas": "11:00 – 15:00",
      "url": "https://soupa.sk/denne-menu-take-away.html",
      "stav": "chyba",
      "polievky": [],
      "jedla": []
    }
  ]
};
</script>

<script>
const DNI = ["nedeľa","pondelok","utorok","streda","štvrtok","piatok","sobota"];
const MESIACE = ["januára","februára","marca","apríla","mája","júna","júla",
                 "augusta","septembra","októbra","novembra","decembra"];
const eur = n => Number(n).toFixed(2).replace(".", ",") + " €";
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function hlavicka(data){
  const d = new Date(data.datum + "T12:00:00");
  document.getElementById("datum").textContent =
    `${DNI[d.getDay()]} ${d.getDate()}. ${MESIACE[d.getMonth()]} ${d.getFullYear()}`;
  const s = document.getElementById("stamp");
  s.querySelector("b").textContent = String(d.getDate()).padStart(2,"0");
  s.querySelector("span").textContent = MESIACE[d.getMonth()].slice(0,3);
}

function riadok(j, jePolievka){
  const stitok = jePolievka ? "P" : (j.c === "TIP" ? "★" : esc(j.c) + ".");
  const kusy = [];
  if (j.veg) kusy.push('<span class="veg">veg</span>');
  if (j.alergeny && j.alergeny.length) kusy.push("alergény " + j.alergeny.join(", "));
  const spodok = kusy.length ? `<div class="j-spodok">${kusy.join("")}</div>` : "";
  return `<li class="jedlo">
    <span class="j-c${jePolievka || j.c === "TIP" ? " p" : ""}">${stitok}</span>
    <span class="j-telo"><span class="j-nazov">${esc(j.nazov)}</span>${spodok}</span>
    <span class="j-cena">${eur(j.cena)}</span>
  </li>`;
}

function karta(r, i){
  const cislo = "№" + String(i+1).padStart(2,"0");
  const meta = [r.adresa, r.cas].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join("");
  const hlava = `<div class="hlava">
      <div class="cislo">${cislo}</div>
      <div class="meno"><h2>${esc(r.nazov)}</h2><div class="meta">${meta}</div></div>
    </div><div class="perf"></div>`;

  const polievky = r.polievky || (r.polievka ? [r.polievka] : []);

  if (r.stav !== "ok" || (!r.jedla?.length && !polievky.length)){
    return `<article class="karta nedostupna">${hlava}
      <p class="hlaska">${r.stav === "zatvorene"
        ? "Dnes zatvorené."
        : "Menu sa nepodarilo načítať."}</p>
      ${r.url ? `<div class="pata"><span></span><a href="${esc(r.url)}" target="_blank" rel="noopener">stránka podniku →</a></div>` : ""}
    </article>`;
  }

  const riadky = [];
  polievky.forEach(p => riadky.push(riadok(p, true)));
  (r.jedla || []).forEach(j => riadky.push(riadok(j, false)));
  const ceny = (r.jedla || []).map(j => Number(j.cena)).filter(c => c > 0);

  return `<article class="karta">${hlava}
    <ul class="jedla">${riadky.join("")}</ul>
    <div class="pata">
      <span>${ceny.length ? "hlavné jedlo od " + eur(Math.min(...ceny)) : ""}</span>
      ${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">stránka →</a>` : ""}
    </div></article>`;
}

function vykresli(data){
  hlavicka(data);
  document.getElementById("zoznam").innerHTML =
    data.restauracie.length
      ? data.restauracie.map(karta).join("")
      : `<p class="hlaska"><b>Prázdno</b>Dnes tu nič nie je.</p>`;

  const cas = new Date(data.aktualizovane);
  const hh = String(cas.getHours()).padStart(2,"0");
  const mm = String(cas.getMinutes()).padStart(2,"0");
  const zle = data.restauracie.filter(r => r.stav !== "ok").length;
  document.getElementById("footer").innerHTML =
    `Aktualizované o ${hh}:${mm}.<br>` +
    (zle ? `${zle} z ${data.restauracie.length} podnikov sa nepodarilo načítať.<br>` : "") +
    `Ceny a alergény sú prevzaté z webu podnikov — overiť si ich treba na mieste.`;
}

/* Vykreslíme okamžite z vložených dát — stránka nikdy nezostane prázdna,
   ani keď je otvorená zo súboru bez servera. */
vykresli(VLOZENE);

/* Potom sa pokúsime dotiahnuť aktuálne dáta. Ak to nevyjde, necháme vložené. */
fetch("data/menu.json?t=" + Date.now(), { cache: "no-store" })
  .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
  .then(d => { if (d && d.restauracie) vykresli(d); })
  .catch(e => {
    const f = document.getElementById("footer");
    f.innerHTML = `Zobrazujem uloženú kópiu z ${VLOZENE.datum}.<br>` +
      `Aktuálne dáta sa nenačítali (${e.message}). Zo súboru v počítači je to normálne.`;
  });

</script>
</body>
</html>
